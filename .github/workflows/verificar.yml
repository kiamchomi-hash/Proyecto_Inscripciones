name: Verificaciones
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * 1'
permissions:
  contents: read
concurrency:
  group: verificar-${{ github.ref }}
  # Un push nuevo no puede interrumpir un deploy que ya empezó. GitHub conserva
  # sólo el pendiente más reciente y el job de publicación vuelve a mirar main.
  cancel-in-progress: false
jobs:
  codigo:
    name: Código y dependencias
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node herramientas/secretos.mjs instalar
      - run: node herramientas/secretos.mjs ci
        env:
          SECRETOS_BASE: ${{ github.event.before }}
      - run: npm run check
      - run: npm audit --omit=dev
  worker:
    name: Configuración del Worker de producción
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Sin dependencias a propósito: el contrato del publicador y de
      # produccion/wrangler.json se verifica leyendo el repo, no instalando.
      - run: node --test tests/publicacion.test.mjs
        working-directory: cloudflare
  codeql:
    name: CodeQL (observación)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
  publicar:
    name: Publicar Worker después de verificar
    needs: [codigo, worker, codeql]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: produccion
    concurrency:
      group: publicar-worker
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cloudflare/package-lock.json
      - name: Dependencias del sitio
        run: npm ci
      - name: Dependencias del Worker
        run: npm ci
        working-directory: cloudflare
      - name: Publicar el commit verificado
        id: publicar
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_R2_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_API_TOKEN }}
          CANARY_VERSION_AFFINITY_CONFIGURED: ${{ vars.CANARY_VERSION_AFFINITY_CONFIGURED }}
          CANARY_BASE_SHA: ${{ github.event.before }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          set -euo pipefail
          referencia="$(git ls-remote --exit-code origin refs/heads/main)"
          read -r actual _ <<< "$referencia"
          if [ "$actual" != "$GITHUB_SHA" ]; then
            echo "Este commit ya no es la punta de main; no se publica."
            echo "publicado=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/publicar.mjs --publicar --smoke-rapido
          echo "publicado=true" >> "$GITHUB_OUTPUT"
      # Avisa a IndexNow (Bing, Yandex, Seznam, Naver) que el sitemap cambió.
      # Va después del deploy porque el script lee la clave y el sitemap de
      # producción, y antes del deploy todavía no están publicados. Si IndexNow
      # no contesta, el sitio ya está publicado igual: el paso se marca en rojo
      # pero el job sigue.
      - name: Avisar a IndexNow lo publicado
        if: steps.publicar.outputs.publicado == 'true'
        continue-on-error: true
        timeout-minutes: 5
        run: |
          set -uo pipefail
          for intento in 1 2 3 4 5; do
            if npm run indexnow; then
              exit 0
            fi
            echo "IndexNow no tomó el aviso (intento ${intento}); espero 15 s."
            sleep 15
          done
          echo "::warning::IndexNow no aceptó el aviso en 5 intentos. Se avisa a mano con npm run indexnow."
          exit 1
